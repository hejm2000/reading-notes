log-level: warning
bind-address: '*'
find-process-mode: always
keep-alive-interval: 15
keep-alive-idle: 600
authentication:
- mihomo:yyds666
skip-auth-prefixes:
- 192.168.1.0/24
- 192.168.31.0/24
- 192.168.100.0/24
- 127.0.0.1/8
experimental:
  quic-go-disable-gso: true
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: yyds666
external-controller-cors:
  allow-origins:
  - '*'
  allow-private-network: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.push.apple.com
tun:
  enable: false
  stack: mixed
  mtu: 1480
  dns-hijack:
  - any:53
  - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
hosts:
  miwifi.com: 192.168.31.2
  epdg.epc.mnc010.mcc234.pub.3gppnetwork.org:
  - 87.194.8.8
  - 87.194.88.8
  - 87.194.89.8
  - 87.194.9.8
  services.googleapis.cn: services.googleapis.com
  cn.bing.com: www4.bing.com
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  prefer-h3: false
  cache-algorithm: arc
  cache-size: 4096
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.msftconnecttest.com
  - +.msftncsi.com
  - captive.apple.com
  - connectivitycheck.gstatic.com
  - detectportal.firefox.com
  - time.nist.gov
  - +.pool.ntp.org
  - time.*.com
  - ntp.*.com
  - +.cmpassport.com
  - id6.me
  - open.e.189.cn
  - mdn.open.wo.cn
  - opencloud.wostore.cn
  - auth.wosms.cn
  - +.10099.com.cn
  - +.market.xiaomi.com
  - +.pub.3gppnetwork.org
  - +.push.apple.com
  - +.bing.com
  - +.miwifi.com
  - +.docker.io
  - +.qq.com
  - rule-set:Direct
  - rule-set:Private
  - rule-set:China
  use-hosts: true
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    rule-set:Advertising,AWAvenueAds: rcode://success
    rule-set:Direct,Private,China:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    rule-set:AI,Telegram,Twitter,SocialMedia,Netflix,YouTube,Spotify,TikTok,disney,Google,Microsoft,Proxy:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
proxy-groups:
- name: 一键连接
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - 香港节点
  - 台湾节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 全部节点
  - 直接连接
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Static.png
- name: 自动选择
  type: url-test
  include-all: true
  url: https://www.google.com/generate_204
  interval: 200
  lazy: true
  hidden: true
  empty-fallback: REJECT
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png
- name: 故障转移
  type: fallback
  proxies:
  - 香港节点
  - 台湾节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 全部节点
  url: https://www.google.com/generate_204
  interval: 200
  lazy: true
  empty-fallback: REJECT
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/ULB.png
- name: 香港节点
  type: select
  include-all: true
  filter: ^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?!.*5x).*$
  proxies:
  - 香港自动
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Hong_Kong.png
- name: 台湾节点
  type: select
  include-all: true
  filter: ^(?=.*(?i)(台|🇹🇼|TW|tai|TPE|TSA|KHH))(?!.*5x).*$
  proxies:
  - 台湾自动
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Taiwan.png
- name: 日本节点
  type: select
  include-all: true
  filter: ^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(尼日利亚|5x)).*$
  proxies:
  - 日本自动
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Japan.png
- name: 美国节点
  type: select
  include-all: true
  filter: ^(?=.*(?i)(美|🇺🇸|US|USA|JFK|SJC|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(Plus|Australia|5x)).*$
  proxies:
  - 美国自动
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/United_States.png
- name: 新加坡节点
  type: select
  include-all: true
  filter: ^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*5x).*$
  proxies:
  - 新加坡自动
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Singapore.png
- name: 全部节点
  type: select
  include-all: true
  proxies:
  - 自动选择
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Global.png
- name: 香港自动
  type: url-test
  include-all: true
  filter: ^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?!.*5x).*$
