proxy-groups:
- name: 一键连接
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - 香港节点
  - 台湾节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 全部节点
  - 直接连接
