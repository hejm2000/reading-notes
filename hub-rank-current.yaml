proxy-groups:
- name: 一键连接
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - 香港节点
  - 台湾节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 全部节点
  - 直接连接
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Static.png
- name: 自动选择
  type: url-test
  include-all: true
  url: https://www.google.com/generate_204
  interval: 200
  lazy: true
  hidden: true
  empty-fallback: REJECT
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png
- name: 故障转移
  type: fallback
  proxies:
  - 香港节点
  - 台湾节点
  - 日本节点
  - 美国节点
  - 新加坡节点
  - 全部节点
  url: https://www.google.com/generate_204
  interval: 200
  lazy: true
  empty-fallback: REJECT
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/ULB.png
- name: 香港节点
  type: select
  include-all: true
  filter: ^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?!.*5x).*$
