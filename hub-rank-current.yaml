  filter: ^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(尼日利亚|5x)).*$
  url: https://www.google.com/generate_204
  interval: 200
  lazy: true
