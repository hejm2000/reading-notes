- name: 自动选择
  type: url-test
  include-all: true
  url: https://www.google.com/generate_204
  interval: 200
  lazy: true
  hidden: true
  empty-fallback: REJECT
  icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png
- name: 故障转移
  type: fallback
  proxies:
  - 香港节点
